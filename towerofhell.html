<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tower of Hell</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; overflow: hidden; touch-action: none; font-family: 'Segoe UI', Arial, sans-serif; }
canvas { display: block; }
#ui { position: absolute; top: 0; left: 0; width: 100%; pointer-events: none; z-index: 2; }
#timer { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); color: #fff; font-size: 28px; font-weight: 900; text-shadow: 0 2px 8px rgba(0,0,0,0.6); letter-spacing: 2px; display: none; }
#section-info { position: absolute; top: 48px; left: 50%; transform: translateX(-50%); color: #ffd93d; font-size: 15px; font-weight: 700; text-shadow: 0 1px 4px rgba(0,0,0,0.5); }
#checkpoint-msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: #6bcb77; font-size: 32px; font-weight: 900; text-shadow: 0 0 20px rgba(107,203,119,0.6); display: none; pointer-events: none; z-index: 3; }
#title-screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); z-index: 10; pointer-events: auto; }
#title-screen h1 { font-size: clamp(36px, 8vw, 72px); color: #e94560; text-shadow: 0 0 30px rgba(233,69,96,0.5), 0 4px 12px rgba(0,0,0,0.5); letter-spacing: 4px; margin-bottom: 8px; }
#title-screen .sub { color: #aaa; font-size: clamp(14px, 3vw, 20px); margin-bottom: 40px; }
.menu-btn { pointer-events: auto; background: #e94560; color: #fff; border: none; padding: 16px 48px; font-size: 24px; font-weight: 900; border-radius: 12px; cursor: pointer; letter-spacing: 2px; box-shadow: 0 4px 20px rgba(233,69,96,0.4); transition: transform 0.1s; margin: 6px; }
.menu-btn:hover { transform: scale(1.05); }
.menu-btn:active { transform: scale(0.97); }
.menu-btn.green { background: #6bcb77; box-shadow: 0 4px 20px rgba(107,203,119,0.4); }
#win-screen { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.75); z-index: 10; pointer-events: auto; }
#win-screen h1 { font-size: clamp(32px, 7vw, 60px); color: #ffd93d; text-shadow: 0 0 30px rgba(255,217,61,0.5); margin-bottom: 8px; }
#win-time { color: #fff; font-size: clamp(20px, 4vw, 36px); margin-bottom: 30px; }
#touch-controls { position: absolute; bottom: 20px; left: 0; width: 100%; display: none; justify-content: space-between; padding: 0 20px; pointer-events: none; z-index: 5; }
.touch-btn { pointer-events: auto; width: 70px; height: 70px; border-radius: 50%; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; font-size: 28px; color: rgba(255,255,255,0.7); user-select: none; -webkit-user-select: none; }
.touch-btn:active { background: rgba(255,255,255,0.3); }
#touch-left-group { display: flex; gap: 12px; }
@media (pointer: coarse) { #touch-controls { display: flex; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="timer">0.00</div>
  <div id="section-info"></div>
</div>
<div id="checkpoint-msg">✅ CHECKPOINT!</div>
<div id="title-screen">
  <h1>TOWER OF HELL</h1>
  <div class="sub">Climb the tower. Don't fall.</div>
  <button class="menu-btn" onclick="startGame()">PLAY</button>
</div>
<div id="win-screen">
  <h1>🏆 YOU MADE IT!</h1>
  <div id="win-time"></div>
  <button class="menu-btn green" onclick="startGame()">PLAY AGAIN</button>
</div>
<div id="touch-controls">
  <div id="touch-left-group">
    <div class="touch-btn" id="tb-left">◀</div>
    <div class="touch-btn" id="tb-right">▶</div>
  </div>
  <div class="touch-btn" id="tb-jump">▲</div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// --- Audio ---
let audioCtx = null;
function ensureAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playTone(freq, dur, type, vol) {
  ensureAudio();
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type || 'square';
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.08, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + dur);
}
function sfxJump() { playTone(440, 0.12, 'square', 0.06); }
function sfxLand() { playTone(120, 0.08, 'triangle', 0.05); }
function sfxFall() { playTone(200, 0.4, 'sawtooth', 0.06); }
function sfxCheckpoint() { playTone(523, 0.15, 'square', 0.06); playTone(659, 0.15, 'square', 0.06); }
function sfxWin() { [523,659,784,1047].forEach((f,i) => setTimeout(() => playTone(f, 0.3, 'square', 0.07), i*120)); }

// --- Constants ---
const GRAVITY = 1600;
const JUMP_VEL = -580;
const MOVE_SPEED = 260;
const PW = 22, PH = 28; // player size
const TOWER_W = 360;
const SECTION_H = 200;
const WALL_T = 14;
const PLAT_H = 12;

const COLORS = ['#e94560','#0f3460','#6bcb77','#ffd93d','#9b59b6','#e67e22','#1abc9c','#3498db','#e74c3c','#2ecc71'];

// --- State ---
let state = 'title';
let tower = null;
let player = null;
let cam = { y: 0 };
let timer = 0;
let bestTime = null;
let keys = {};
let touchL = false, touchR = false, touchJ = false;
let lastTime = 0;
let checkpoint = null; // {x, y, section}
let checkpointMsg = 0; // display timer

// --- Resize ---
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// --- Seeded RNG ---
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// --- Tower Generation ---
function generateTower() {
  const seed = Date.now();
  const rng = mulberry32(seed);
  const numSections = 8;
  const sections = [];
  const towerLeft = Math.floor((canvas.width - TOWER_W) / 2);
  const innerW = TOWER_W - WALL_T * 2;

  for (let i = 0; i < numSections; i++) {
    const color = COLORS[i % COLORS.length];
    // Section bottom Y: section 0 starts at y=0, going upward (negative Y)
    // Ground floor is at floorY. Section i spans from floorY - (i+1)*SECTION_H to floorY - i*SECTION_H
    const topY = -(i + 1) * SECTION_H;
    const botY = -i * SECTION_H;
    const platforms = [];
    const diff = i / numSections; // 0..1

    // 4-6 platforms per section, zigzagging left/right for reachability
    const numPlats = 4 + Math.floor(rng() * 3);
    for (let p = 0; p < numPlats; p++) {
      const frac = (p + 0.5) / numPlats;
      const py = botY - frac * SECTION_H;
      // Alternate sides
      const leftSide = (p + i) % 2 === 0;
      const pw = 70 + rng() * 60;
      let px;
      if (leftSide) {
        px = towerLeft + WALL_T + rng() * (innerW * 0.35);
      } else {
        px = towerLeft + WALL_T + innerW - pw - rng() * (innerW * 0.35);
      }

      let type = 'static';
      const roll = rng();
      if (diff > 0.3 && roll < 0.2) type = 'moving';
      else if (diff > 0.5 && roll < 0.35) type = 'disappearing';

      platforms.push({
        x: px, y: py, w: pw, h: PLAT_H,
        type, color,
        baseX: px,
        movePhase: rng() * Math.PI * 2,
        moveRange: 40 + rng() * 40,
        moveSpeed: 1.5 + rng() * 1.5,
        visible: true,
        touched: false,
        disappearTimer: 0,
        disappearDelay: 1.2,
        reappearDelay: 2.0
      });
    }

    // Checkpoint flag at bottom of each section (every 2 sections)
    const hasCheckpoint = i > 0 && i % 2 === 0;

    sections.push({ topY, botY, color, platforms, index: i, hasCheckpoint });
  }

  const floorY = 60; // ground Y
  const topY = -(numSections) * SECTION_H - 60;

  return { sections, towerLeft, numSections, floorY, topY, innerW, seed };
}

function resetPlayer(useCheckpoint) {
  const tl = tower.towerLeft;
  if (useCheckpoint && checkpoint) {
    player = {
      x: checkpoint.x, y: checkpoint.y,
      vx: 0, vy: 0, grounded: false,
      coyote: 0, jumpBuf: 0,
      facingRight: true,
      color: player ? player.color : randomColor()
    };
  } else {
    checkpoint = null;
    player = {
      x: tl + TOWER_W / 2 - PW / 2, y: tower.floorY - PH,
      vx: 0, vy: 0, grounded: false,
      coyote: 0, jumpBuf: 0,
      facingRight: true,
      color: randomColor()
    };
  }
}

function randomColor() {
  return ['#ff6b6b','#6bcb77','#4d96ff','#ffd93d','#cc66ff','#ff9f43'][Math.floor(Math.random()*6)];
}

function startGame() {
  ensureAudio();
  document.getElementById('title-screen').style.display = 'none';
  document.getElementById('win-screen').style.display = 'none';
  document.getElementById('timer').style.display = 'block';
  tower = generateTower();
  checkpoint = null;
  resetPlayer(false);
  timer = 0;
  cam.y = 0;
  state = 'playing';
}

function winGame() {
  state = 'win';
  sfxWin();
  const t = timer.toFixed(2);
  let msg = `Time: ${t}s`;
  if (bestTime !== null) msg += ` | Best: ${Math.min(bestTime, timer).toFixed(2)}s`;
  document.getElementById('win-time').textContent = msg;
  if (bestTime === null || timer < bestTime) bestTime = timer;
  document.getElementById('win-screen').style.display = 'flex';
  document.getElementById('timer').style.display = 'none';
}

// --- Update ---
function update(dt) {
  if (state !== 'playing') return;
  timer += dt;
  document.getElementById('timer').textContent = timer.toFixed(2);

  if (checkpointMsg > 0) {
    checkpointMsg -= dt;
    document.getElementById('checkpoint-msg').style.display = checkpointMsg > 0 ? 'block' : 'none';
  }

  const p = player;
  const tl = tower.towerLeft;

  // Input
  const left = keys['ArrowLeft'] || keys['KeyA'] || touchL;
  const right = keys['ArrowRight'] || keys['KeyD'] || touchR;
  const jump = keys['Space'] || keys['ArrowUp'] || keys['KeyW'] || touchJ;

  // Horizontal
  p.vx = 0;
  if (left) { p.vx = -MOVE_SPEED; p.facingRight = false; }
  if (right) { p.vx = MOVE_SPEED; p.facingRight = true; }

  // Gravity
  p.vy += GRAVITY * dt;
  if (p.vy > 800) p.vy = 800;

  // Jump buffer + coyote time
  if (jump) p.jumpBuf = 0.12;
  else p.jumpBuf = Math.max(0, p.jumpBuf - dt);
  if (!p.grounded) p.coyote = Math.max(0, p.coyote - dt);

  if (p.jumpBuf > 0 && (p.grounded || p.coyote > 0)) {
    p.vy = JUMP_VEL;
    p.grounded = false;
    p.coyote = 0;
    p.jumpBuf = 0;
    sfxJump();
  }

  // Move X
  p.x += p.vx * dt;
  if (p.x < tl + WALL_T) p.x = tl + WALL_T;
  if (p.x + PW > tl + TOWER_W - WALL_T) p.x = tl + TOWER_W - WALL_T - PW;

  // Move Y
  const wasGrounded = p.grounded;
  p.y += p.vy * dt;
  p.grounded = false;

  // Floor
  if (p.y + PH > tower.floorY) {
    p.y = tower.floorY - PH;
    if (p.vy > 0) { p.vy = 0; p.grounded = true; p.coyote = 0.1; }
  }

  // Platform collisions
  for (const sec of tower.sections) {
    for (const plat of sec.platforms) {
      // Update moving
      if (plat.type === 'moving') {
        plat.x = plat.baseX + Math.sin(timer * plat.moveSpeed + plat.movePhase) * plat.moveRange;
      }
      // Update disappearing
      if (plat.type === 'disappearing' && plat.touched) {
        plat.disappearTimer += dt;
        if (plat.visible && plat.disappearTimer > plat.disappearDelay) {
          plat.visible = false;
          plat.disappearTimer = 0;
        } else if (!plat.visible && plat.disappearTimer > plat.reappearDelay) {
          plat.visible = true;
          plat.touched = false;
          plat.disappearTimer = 0;
        }
      }

      if (!plat.visible) continue;

      // Only land on top (one-way platform)
      const onX = p.x + PW > plat.x && p.x < plat.x + plat.w;
      const feetY = p.y + PH;
      const prevFeetY = feetY - p.vy * dt;

      if (onX && p.vy >= 0 && feetY >= plat.y && prevFeetY <= plat.y + 6) {
        p.y = plat.y - PH;
        p.vy = 0;
        p.grounded = true;
        p.coyote = 0.1;
        if (!wasGrounded) sfxLand();

        // Ride moving platform
        if (plat.type === 'moving') {
          const nextX = plat.baseX + Math.sin((timer + dt) * plat.moveSpeed + plat.movePhase) * plat.moveRange;
          p.x += nextX - plat.x;
        }

        // Trigger disappearing
        if (plat.type === 'disappearing' && !plat.touched) {
          plat.touched = true;
          plat.disappearTimer = 0;
        }
      }
    }

    // Checkpoint detection
    if (sec.hasCheckpoint && p.y < sec.botY && (!checkpoint || checkpoint.section < sec.index)) {
      checkpoint = { x: p.x, y: p.y, section: sec.index };
      checkpointMsg = 1.5;
      document.getElementById('checkpoint-msg').style.display = 'block';
      sfxCheckpoint();
    }
  }

  // Fall below floor — respawn at checkpoint or bottom
  if (p.y > tower.floorY + 200) {
    sfxFall();
    // Reset disappearing platforms
    tower.sections.forEach(s => s.platforms.forEach(pl => {
      pl.visible = true; pl.touched = false; pl.disappearTimer = 0;
    }));
    resetPlayer(true);
    return;
  }

  // Win — reached top
  if (p.y + PH < tower.topY + 40) {
    winGame();
    return;
  }

  // Camera
  const targetCam = Math.min(0, -(p.y - canvas.height * 0.55));
  cam.y += (targetCam - cam.y) * 5 * dt;

  // Section info
  const secIdx = Math.max(0, Math.floor((-p.y) / SECTION_H));
  const info = document.getElementById('section-info');
  if (secIdx >= 0 && secIdx < tower.numSections) {
    info.textContent = `Section ${secIdx + 1} / ${tower.numSections}`;
  } else {
    info.textContent = '';
  }
}

// --- Render ---
function render() {
  const W = canvas.width, H = canvas.height;

  // Background gradient
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0f0c29');
  grad.addColorStop(0.5, '#302b63');
  grad.addColorStop(1, '#24243e');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  if (!tower || state === 'title') return;

  ctx.save();
  ctx.translate(0, cam.y);

  const tl = tower.towerLeft;

  // Stars (parallax)
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  for (let i = 0; i < 50; i++) {
    const sx = (i * 137.5) % W;
    const sy = ((i * 211.3) % (tower.numSections * SECTION_H + H)) - tower.numSections * SECTION_H;
    ctx.fillRect(sx, sy - cam.y * 0.3, 1 + i % 3, 1 + i % 3);
  }

  // Tower walls
  const wallTop = tower.topY - 40;
  const wallBot = tower.floorY + 30;
  ctx.fillStyle = '#2a2a4a';
  ctx.fillRect(tl, wallTop, WALL_T, wallBot - wallTop);
  ctx.fillRect(tl + TOWER_W - WALL_T, wallTop, WALL_T, wallBot - wallTop);
  // Wall stripes
  ctx.fillStyle = '#3a3a5a';
  for (let wy = wallTop; wy < wallBot; wy += 30) {
    ctx.fillRect(tl, wy, WALL_T, 2);
    ctx.fillRect(tl + TOWER_W - WALL_T, wy, WALL_T, 2);
  }

  // Floor
  ctx.fillStyle = '#4a4a6a';
  ctx.fillRect(tl, tower.floorY, TOWER_W, 20);
  ctx.fillStyle = '#6a6a8a';
  ctx.fillRect(tl, tower.floorY, TOWER_W, 3);

  // Section backgrounds + platforms
  for (const sec of tower.sections) {
    // Section divider
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(tl + WALL_T, sec.botY);
    ctx.lineTo(tl + TOWER_W - WALL_T, sec.botY);
    ctx.stroke();

    // Big section number watermark
    ctx.fillStyle = 'rgba(255,255,255,0.03)';
    ctx.font = 'bold 80px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(sec.index + 1, tl + TOWER_W / 2, sec.topY + SECTION_H * 0.65);

    // Checkpoint flag
    if (sec.hasCheckpoint) {
      const flagX = tl + TOWER_W / 2;
      const flagY = sec.botY - 10;
      const reached = checkpoint && checkpoint.section >= sec.index;
      // Pole
      ctx.strokeStyle = '#888';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(flagX, flagY);
      ctx.lineTo(flagX, flagY - 35);
      ctx.stroke();
      // Flag
      ctx.fillStyle = reached ? '#6bcb77' : '#555';
      ctx.beginPath();
      ctx.moveTo(flagX, flagY - 35);
      ctx.lineTo(flagX + 20, flagY - 28);
      ctx.lineTo(flagX, flagY - 21);
      ctx.fill();
    }

    // Platforms
    for (const plat of sec.platforms) {
      if (!plat.visible) {
        // Ghost outline for disappearing platforms
        if (plat.type === 'disappearing') {
          ctx.strokeStyle = 'rgba(255,255,255,0.1)';
          ctx.lineWidth = 1;
          ctx.setLineDash([4, 4]);
          ctx.strokeRect(plat.x, plat.y, plat.w, plat.h);
          ctx.setLineDash([]);
        }
        continue;
      }

      // Flash if about to disappear
      if (plat.type === 'disappearing' && plat.touched) {
        ctx.globalAlpha = Math.sin(timer * 12) > 0 ? 0.5 : 1;
      }

      // Platform body
      ctx.fillStyle = plat.color;
      ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
      // Top highlight
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.fillRect(plat.x, plat.y, plat.w, 3);
      // Bottom shadow
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fillRect(plat.x, plat.y + plat.h - 2, plat.w, 2);

      ctx.globalAlpha = 1;

      // Moving indicator
      if (plat.type === 'moving') {
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.font = '11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('↔', plat.x + plat.w / 2, plat.y - 4);
      }
      // Disappearing indicator
      if (plat.type === 'disappearing' && !plat.touched) {
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.font = '11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('⚠', plat.x + plat.w / 2, plat.y - 4);
      }
    }
  }

  // Finish zone at top
  const finY = tower.topY;
  ctx.fillStyle = '#ffd93d';
  ctx.fillRect(tl + WALL_T, finY, TOWER_W - WALL_T * 2, 14);
  ctx.fillStyle = 'rgba(255,217,61,0.12)';
  ctx.fillRect(tl + WALL_T, finY - 50, TOWER_W - WALL_T * 2, 50);
  // Checkered pattern
  for (let sx = tl + WALL_T; sx < tl + TOWER_W - WALL_T; sx += 28) {
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(sx, finY, 14, 7);
    ctx.fillRect(sx + 14, finY + 7, 14, 7);
  }
  ctx.fillStyle = '#ffd93d';
  ctx.font = 'bold 16px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('🏆 FINISH', tl + TOWER_W / 2, finY - 14);

  // Player
  if (player) {
    const p = player;
    // Shadow
    if (p.grounded) {
      ctx.fillStyle = 'rgba(0,0,0,0.15)';
      ctx.beginPath();
      ctx.ellipse(p.x + PW / 2, p.y + PH + 2, PW * 0.4, 3, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    // Body
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.roundRect(p.x, p.y, PW, PH, 4);
    ctx.fill();
    // Highlight
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillRect(p.x + 3, p.y + 3, PW - 6, 5);
    // Eyes
    const eyeX = p.facingRight ? p.x + PW - 8 : p.x + 3;
    ctx.fillStyle = '#fff';
    ctx.fillRect(eyeX, p.y + 7, 5, 5);
    ctx.fillStyle = '#111';
    ctx.fillRect(p.facingRight ? eyeX + 2 : eyeX, p.y + 9, 3, 3);
  }

  ctx.restore();
}

// --- Input ---
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space' || e.code === 'ArrowUp') e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

function setupTouch(id, onDown, onUp) {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', e => { e.preventDefault(); onDown(); });
  el.addEventListener('touchend', e => { e.preventDefault(); onUp(); });
  el.addEventListener('touchcancel', () => onUp());
}
setupTouch('tb-left', () => touchL = true, () => touchL = false);
setupTouch('tb-right', () => touchR = true, () => touchR = false);
setupTouch('tb-jump', () => touchJ = true, () => touchJ = false);

// --- Game Loop ---
function loop(ts) {
  const dt = Math.min(0.05, (ts - lastTime) / 1000);
  lastTime = ts;
  if (state === 'playing') update(dt);
  render();
  requestAnimationFrame(loop);
}

lastTime = performance.now();
requestAnimationFrame(loop);
</script>
</body>
</html>
