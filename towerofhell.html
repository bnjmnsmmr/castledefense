<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tower of Hell</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; overflow: hidden; touch-action: none; font-family: 'Segoe UI', Arial, sans-serif; }
canvas { display: block; }
#ui { position: absolute; top: 0; left: 0; width: 100%; pointer-events: none; }
#timer { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); color: #fff; font-size: 28px; font-weight: 900; text-shadow: 0 2px 8px rgba(0,0,0,0.6); letter-spacing: 2px; }
#section-info { position: absolute; top: 48px; left: 50%; transform: translateX(-50%); color: #ffd93d; font-size: 15px; font-weight: 700; text-shadow: 0 1px 4px rgba(0,0,0,0.5); }
#title-screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); z-index: 10; pointer-events: auto; }
#title-screen h1 { font-size: clamp(36px, 8vw, 72px); color: #e94560; text-shadow: 0 0 30px rgba(233,69,96,0.5), 0 4px 12px rgba(0,0,0,0.5); letter-spacing: 4px; margin-bottom: 8px; }
#title-screen .sub { color: #aaa; font-size: clamp(14px, 3vw, 20px); margin-bottom: 40px; }
#play-btn { pointer-events: auto; background: #e94560; color: #fff; border: none; padding: 16px 48px; font-size: 24px; font-weight: 900; border-radius: 12px; cursor: pointer; letter-spacing: 2px; box-shadow: 0 4px 20px rgba(233,69,96,0.4); transition: transform 0.1s, box-shadow 0.1s; }
#play-btn:hover { transform: scale(1.05); box-shadow: 0 6px 30px rgba(233,69,96,0.6); }
#play-btn:active { transform: scale(0.97); }
#win-screen { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.75); z-index: 10; pointer-events: auto; }
#win-screen h1 { font-size: clamp(32px, 7vw, 60px); color: #ffd93d; text-shadow: 0 0 30px rgba(255,217,61,0.5); margin-bottom: 8px; }
#win-time { color: #fff; font-size: clamp(20px, 4vw, 36px); margin-bottom: 30px; }
#win-screen button { background: #6bcb77; color: #fff; border: none; padding: 14px 40px; font-size: 22px; font-weight: 900; border-radius: 12px; cursor: pointer; letter-spacing: 2px; }
#touch-controls { position: absolute; bottom: 20px; left: 0; width: 100%; display: none; justify-content: space-between; padding: 0 20px; pointer-events: none; z-index: 5; }
.touch-btn { pointer-events: auto; width: 70px; height: 70px; border-radius: 50%; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; font-size: 28px; color: rgba(255,255,255,0.7); user-select: none; -webkit-user-select: none; }
.touch-btn:active { background: rgba(255,255,255,0.3); }
#touch-left-group { display: flex; gap: 12px; }
@media (pointer: coarse) { #touch-controls { display: flex; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="timer">0.00</div>
  <div id="section-info"></div>
</div>
<div id="title-screen">
  <h1>TOWER OF HELL</h1>
  <div class="sub">No checkpoints. No mercy.</div>
  <button id="play-btn" onclick="startGame()">PLAY</button>
</div>
<div id="win-screen">
  <h1>🏆 YOU MADE IT!</h1>
  <div id="win-time"></div>
  <button onclick="startGame()">PLAY AGAIN</button>
</div>
<div id="touch-controls">
  <div id="touch-left-group">
    <div class="touch-btn" id="tb-left">◀</div>
    <div class="touch-btn" id="tb-right">▶</div>
  </div>
  <div class="touch-btn" id="tb-jump">▲</div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// --- Audio ---
let audioCtx = null;
function ensureAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playTone(freq, dur, type, vol) {
  ensureAudio();
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type || 'square';
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.08, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + dur);
}
function sfxJump() { playTone(440, 0.12, 'square', 0.06); playTone(580, 0.1, 'square', 0.04); }
function sfxLand() { playTone(120, 0.08, 'triangle', 0.05); }
function sfxFall() { playTone(200, 0.4, 'sawtooth', 0.06); setTimeout(() => playTone(100, 0.3, 'sawtooth', 0.04), 150); }
function sfxWin() { [523,659,784,1047].forEach((f,i) => setTimeout(() => playTone(f, 0.3, 'square', 0.07), i*120)); }
function sfxDisappear() { playTone(300, 0.15, 'triangle', 0.04); }

// --- Constants ---
const GRAVITY = 1800;
const JUMP_VEL = -620;
const MOVE_SPEED = 280;
const PLAYER_W = 24;
const PLAYER_H = 30;
const TOWER_W = 400;
const SECTION_H = 180;
const WALL_THICKNESS = 16;

// --- Colors ---
const SECTION_COLORS = [
  '#e94560', '#0f3460', '#6bcb77', '#ffd93d',
  '#9b59b6', '#e67e22', '#1abc9c', '#3498db',
  '#e74c3c', '#2ecc71', '#f39c12', '#8e44ad'
];

// --- State ---
let state = 'title'; // title, playing, win
let tower = null;
let player = null;
let camera = { y: 0 };
let timer = 0;
let keys = {};
let touchLeft = false, touchRight = false, touchJump = false;
let lastTime = 0;
let bestTime = null;

// --- Resize ---
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// --- Tower Generation ---
function generateTower() {
  const numSections = 8 + Math.floor(Math.random() * 5); // 8-12
  const sections = [];
  const towerLeft = (canvas.width - TOWER_W) / 2;

  for (let i = 0; i < numSections; i++) {
    const color = SECTION_COLORS[i % SECTION_COLORS.length];
    const baseY = -(i + 1) * SECTION_H;
    const platforms = [];
    const difficulty = Math.min(1, i / (numSections - 1));

    // Each section gets 3-5 platforms
    const numPlats = 3 + Math.floor(Math.random() * 3);

    // Ensure reachability: alternate sides with increasing height
    for (let p = 0; p < numPlats; p++) {
      const frac = (p + 0.5) / numPlats;
      const py = baseY + SECTION_H * (1 - frac);
      const side = (p + i) % 2 === 0 ? 'left' : 'right';
      const pw = 60 + Math.random() * 80;
      let px;
      if (side === 'left') {
        px = towerLeft + WALL_THICKNESS + Math.random() * (TOWER_W * 0.3);
      } else {
        px = towerLeft + TOWER_W - WALL_THICKNESS - pw - Math.random() * (TOWER_W * 0.3);
      }

      // Pick platform type based on difficulty
      let type = 'static';
      const roll = Math.random();
      if (difficulty > 0.2 && roll < 0.25 * difficulty) {
        type = 'moving';
      } else if (difficulty > 0.4 && roll < 0.4 * difficulty) {
        type = 'disappearing';
      } else if (difficulty > 0.3 && roll < 0.3) {
        type = 'thin';
      }

      platforms.push({
        x: px, y: py, w: pw, h: type === 'thin' ? 6 : 14,
        type, color,
        // Moving platform state
        moveDir: Math.random() < 0.5 ? 1 : -1,
        moveRange: 60 + Math.random() * 40,
        moveSpeed: 60 + Math.random() * 80,
        baseX: px,
        // Disappearing platform state
        visible: true,
        disappearTimer: 0,
        disappearDelay: 0.8 + Math.random() * 0.6,
        reappearDelay: 1.5 + Math.random() * 1.0,
        touched: false,
        // Spinner obstacle (rare)
        hasSpinner: difficulty > 0.5 && Math.random() < 0.2 * difficulty,
        spinnerAngle: Math.random() * Math.PI * 2,
        spinnerSpeed: 2 + Math.random() * 3,
        spinnerLen: 35 + Math.random() * 20
      });
    }

    sections.push({ baseY, color, platforms, index: i });
  }

  // The finish platform at the very top
  const topY = -(numSections + 1) * SECTION_H + 40;

  return {
    sections,
    towerLeft,
    numSections,
    floorY: 40,
    topY,
    totalHeight: (numSections + 1) * SECTION_H
  };
}

// --- Player ---
function resetPlayer() {
  const cx = tower.towerLeft + TOWER_W / 2;
  player = {
    x: cx - PLAYER_W / 2,
    y: tower.floorY - PLAYER_H,
    vx: 0, vy: 0,
    grounded: false,
    wasGrounded: false,
    jumpBuffer: 0,
    coyoteTime: 0,
    facingRight: true,
    color: '#' + ['ff6b6b','6bcb77','4d96ff','ffd93d','cc66ff','ff9f43'][Math.floor(Math.random()*6)]
  };
}

function startGame() {
  ensureAudio();
  document.getElementById('title-screen').style.display = 'none';
  document.getElementById('win-screen').style.display = 'none';
  tower = generateTower();
  resetPlayer();
  timer = 0;
  camera.y = 0;
  state = 'playing';
  // Reset disappearing platforms
  tower.sections.forEach(s => s.platforms.forEach(p => {
    p.visible = true; p.touched = false; p.disappearTimer = 0;
  }));
}

function winGame() {
  state = 'win';
  sfxWin();
  const t = timer.toFixed(2);
  document.getElementById('win-time').textContent = `Time: ${t}s` + (bestTime !== null ? ` | Best: ${Math.min(bestTime, timer).toFixed(2)}s` : '');
  if (bestTime === null || timer < bestTime) bestTime = timer;
  document.getElementById('win-screen').style.display = 'flex';
}

// --- Update ---
function update(dt) {
  if (state !== 'playing') return;
  timer += dt;
  document.getElementById('timer').textContent = timer.toFixed(2);

  const p = player;
  const tl = tower.towerLeft;
  const tr = tl + TOWER_W;

  // Input
  const moveLeft = keys['ArrowLeft'] || keys['KeyA'] || touchLeft;
  const moveRight = keys['ArrowRight'] || keys['KeyD'] || touchRight;
  const jumpPressed = keys['Space'] || keys['ArrowUp'] || keys['KeyW'] || touchJump;

  // Horizontal movement
  p.vx = 0;
  if (moveLeft) { p.vx = -MOVE_SPEED; p.facingRight = false; }
  if (moveRight) { p.vx = MOVE_SPEED; p.facingRight = true; }

  // Gravity
  p.vy += GRAVITY * dt;
  if (p.vy > 900) p.vy = 900;

  // Jump (with coyote time + jump buffer)
  if (jumpPressed) p.jumpBuffer = 0.1;
  else p.jumpBuffer -= dt;

  if (!p.grounded) p.coyoteTime -= dt;

  if (p.jumpBuffer > 0 && (p.grounded || p.coyoteTime > 0)) {
    p.vy = JUMP_VEL;
    p.grounded = false;
    p.coyoteTime = 0;
    p.jumpBuffer = 0;
    sfxJump();
  }

  // Move X
  p.x += p.vx * dt;
  // Wall collision
  if (p.x < tl + WALL_THICKNESS) p.x = tl + WALL_THICKNESS;
  if (p.x + PLAYER_W > tr - WALL_THICKNESS) p.x = tr - WALL_THICKNESS - PLAYER_W;

  // Move Y
  p.wasGrounded = p.grounded;
  p.y += p.vy * dt;
  p.grounded = false;

  // Floor collision
  if (p.y + PLAYER_H > tower.floorY) {
    p.y = tower.floorY - PLAYER_H;
    if (p.vy > 0) { p.vy = 0; p.grounded = true; p.coyoteTime = 0.08; }
  }

  // Platform collisions
  for (const sec of tower.sections) {
    for (const plat of sec.platforms) {
      // Update moving platforms
      if (plat.type === 'moving') {
        plat.x = plat.baseX + Math.sin(timer * plat.moveSpeed / 60) * plat.moveRange;
      }
      // Update disappearing platforms
      if (plat.type === 'disappearing' && plat.touched) {
        plat.disappearTimer += dt;
        if (plat.visible && plat.disappearTimer > plat.disappearDelay) {
          plat.visible = false;
          plat.disappearTimer = 0;
          sfxDisappear();
        } else if (!plat.visible && plat.disappearTimer > plat.reappearDelay) {
          plat.visible = true;
          plat.touched = false;
          plat.disappearTimer = 0;
        }
      }
      // Update spinners
      if (plat.hasSpinner) {
        plat.spinnerAngle += plat.spinnerSpeed * dt;
      }

      if (!plat.visible) continue;

      // Collision: only land on top
      const onX = p.x + PLAYER_W > plat.x && p.x < plat.x + plat.w;
      const feetY = p.y + PLAYER_H;
      const prevFeetY = feetY - p.vy * dt;

      if (onX && p.vy >= 0 && feetY >= plat.y && prevFeetY <= plat.y + plat.h + 4) {
        p.y = plat.y - PLAYER_H;
        p.vy = 0;
        p.grounded = true;
        p.coyoteTime = 0.08;
        if (!p.wasGrounded) sfxLand();

        // Ride moving platform
        if (plat.type === 'moving') {
          const newX = plat.baseX + Math.sin((timer + dt) * plat.moveSpeed / 60) * plat.moveRange;
          p.x += (newX - plat.x) * 0.8;
        }

        // Trigger disappearing
        if (plat.type === 'disappearing' && !plat.touched) {
          plat.touched = true;
          plat.disappearTimer = 0;
        }
      }

      // Spinner collision
      if (plat.hasSpinner) {
        const cx = plat.x + plat.w / 2;
        const cy = plat.y - 20;
        const ex = cx + Math.cos(plat.spinnerAngle) * plat.spinnerLen;
        const ey = cy + Math.sin(plat.spinnerAngle) * plat.spinnerLen;
        const pcx = p.x + PLAYER_W / 2;
        const pcy = p.y + PLAYER_H / 2;
        // Distance from player center to spinner tip
        const dist = Math.hypot(pcx - ex, pcy - ey);
        if (dist < 18) {
          // Knockback
          p.vy = -300;
          p.vx = (pcx > ex ? 200 : -200);
          p.grounded = false;
        }
      }
    }
  }

  // Check if fell too far below (restart)
  if (p.y > tower.floorY + 100) {
    sfxFall();
    resetPlayer();
    camera.y = 0;
    // Reset disappearing platforms
    tower.sections.forEach(s => s.platforms.forEach(pl => {
      pl.visible = true; pl.touched = false; pl.disappearTimer = 0;
    }));
    return;
  }

  // Win check — reached top
  if (p.y < tower.topY) {
    winGame();
    return;
  }

  // Camera follows player upward (smooth)
  const targetCam = Math.min(0, -(p.y - canvas.height * 0.55));
  camera.y += (targetCam - camera.y) * 5 * dt;

  // Section info
  const sectionIdx = Math.max(0, Math.floor(-p.y / SECTION_H));
  const info = document.getElementById('section-info');
  if (sectionIdx > 0 && sectionIdx <= tower.numSections) {
    info.textContent = `Section ${sectionIdx} / ${tower.numSections}`;
  } else {
    info.textContent = '';
  }
}

// --- Render ---
function render() {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  // Sky gradient background
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0f0c29');
  grad.addColorStop(0.5, '#302b63');
  grad.addColorStop(1, '#24243e');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(0, camera.y);

  const tl = tower.towerLeft;

  // Draw stars (parallax)
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  for (let i = 0; i < 60; i++) {
    const sx = ((i * 137.5) % W);
    const sy = ((i * 211.3) % (tower.totalHeight + H)) - tower.totalHeight;
    const ss = 1 + (i % 3);
    ctx.fillRect(sx, sy - camera.y * 0.3, ss, ss);
  }

  // Tower walls
  const wallTop = tower.topY - 60;
  const wallBot = tower.floorY + 20;
  const wallH = wallBot - wallTop;

  // Left wall
  ctx.fillStyle = '#2a2a4a';
  ctx.fillRect(tl, wallTop, WALL_THICKNESS, wallH);
  // Right wall
  ctx.fillRect(tl + TOWER_W - WALL_THICKNESS, wallTop, WALL_THICKNESS, wallH);

  // Wall stripes
  ctx.fillStyle = '#3a3a5a';
  for (let wy = wallTop; wy < wallBot; wy += 36) {
    ctx.fillRect(tl, wy, WALL_THICKNESS, 2);
    ctx.fillRect(tl + TOWER_W - WALL_THICKNESS, wy, WALL_THICKNESS, 2);
  }

  // Floor
  ctx.fillStyle = '#4a4a6a';
  ctx.fillRect(tl, tower.floorY, TOWER_W, 20);
  ctx.fillStyle = '#5a5a7a';
  ctx.fillRect(tl, tower.floorY, TOWER_W, 3);

  // Section backgrounds + platforms
  for (const sec of tower.sections) {
    // Section divider line
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(tl + WALL_THICKNESS, sec.baseY + SECTION_H);
    ctx.lineTo(tl + TOWER_W - WALL_THICKNESS, sec.baseY + SECTION_H);
    ctx.stroke();

    // Section number
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    ctx.font = 'bold 60px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(sec.index + 1, tl + TOWER_W / 2, sec.baseY + SECTION_H - 50);

    // Platforms
    for (const plat of sec.platforms) {
      if (!plat.visible) {
        // Ghost outline for disappearing
        if (plat.type === 'disappearing') {
          ctx.strokeStyle = 'rgba(255,255,255,0.1)';
          ctx.lineWidth = 1;
          ctx.setLineDash([4, 4]);
          ctx.strokeRect(plat.x, plat.y, plat.w, plat.h);
          ctx.setLineDash([]);
        }
        continue;
      }

      // Platform body
      const c = plat.color;
      if (plat.type === 'disappearing' && plat.touched) {
        const flash = Math.sin(timer * 12) > 0 ? 0.6 : 1;
        ctx.globalAlpha = flash;
      }

      ctx.fillStyle = c;
      ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
      // Highlight
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.fillRect(plat.x, plat.y, plat.w, 3);
      // Shadow
      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.fillRect(plat.x, plat.y + plat.h - 2, plat.w, 2);

      ctx.globalAlpha = 1;

      // Type indicator icon
      if (plat.type === 'moving') {
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('↔', plat.x + plat.w / 2, plat.y - 3);
      }

      // Spinner
      if (plat.hasSpinner) {
        const cx = plat.x + plat.w / 2;
        const cy = plat.y - 20;
        const ex = cx + Math.cos(plat.spinnerAngle) * plat.spinnerLen;
        const ey = cy + Math.sin(plat.spinnerAngle) * plat.spinnerLen;
        ctx.strokeStyle = '#ff4444';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(ex, ey);
        ctx.stroke();
        // Tip
        ctx.fillStyle = '#ff6666';
        ctx.beginPath();
        ctx.arc(ex, ey, 8, 0, Math.PI * 2);
        ctx.fill();
        // Center
        ctx.fillStyle = '#cc2222';
        ctx.beginPath();
        ctx.arc(cx, cy, 5, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // Finish zone
  const finY = tower.topY;
  ctx.fillStyle = '#ffd93d';
  ctx.fillRect(tl + WALL_THICKNESS, finY - 10, TOWER_W - WALL_THICKNESS * 2, 14);
  ctx.fillStyle = 'rgba(255,217,61,0.15)';
  ctx.fillRect(tl + WALL_THICKNESS, finY - 60, TOWER_W - WALL_THICKNESS * 2, 60);
  // Checkered finish pattern
  const stripeW = 20;
  for (let sx = tl + WALL_THICKNESS; sx < tl + TOWER_W - WALL_THICKNESS; sx += stripeW * 2) {
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(sx, finY - 10, stripeW, 7);
    ctx.fillRect(sx + stripeW, finY - 3, stripeW, 7);
  }
  ctx.fillStyle = '#ffd93d';
  ctx.font = 'bold 18px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('🏆 FINISH', tl + TOWER_W / 2, finY - 20);

  // Player
  if (player && state === 'playing') {
    const p = player;
    ctx.fillStyle = p.color;
    // Body
    const radius = 5;
    ctx.beginPath();
    ctx.roundRect(p.x, p.y, PLAYER_W, PLAYER_H, radius);
    ctx.fill();
    // Highlight
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillRect(p.x + 3, p.y + 3, PLAYER_W - 6, 6);
    // Eyes
    const eyeX = p.facingRight ? p.x + PLAYER_W - 9 : p.x + 4;
    ctx.fillStyle = '#fff';
    ctx.fillRect(eyeX, p.y + 8, 5, 6);
    ctx.fillStyle = '#111';
    ctx.fillRect(p.facingRight ? eyeX + 2 : eyeX, p.y + 10, 3, 3);
    // Shadow on ground if grounded
    if (p.grounded) {
      ctx.fillStyle = 'rgba(0,0,0,0.15)';
      ctx.beginPath();
      ctx.ellipse(p.x + PLAYER_W / 2, p.y + PLAYER_H + 2, PLAYER_W * 0.4, 3, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  ctx.restore();
}

// --- Input ---
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

// Touch controls
function setupTouch(id, onDown, onUp) {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', e => { e.preventDefault(); onDown(); });
  el.addEventListener('touchend', e => { e.preventDefault(); onUp(); });
  el.addEventListener('touchcancel', e => { onUp(); });
}
setupTouch('tb-left', () => touchLeft = true, () => touchLeft = false);
setupTouch('tb-right', () => touchRight = true, () => touchRight = false);
setupTouch('tb-jump', () => touchJump = true, () => touchJump = false);

// --- Game Loop ---
function loop(ts) {
  const dt = Math.min(0.05, (ts - lastTime) / 1000);
  lastTime = ts;

  if (state === 'playing') {
    update(dt);
  }
  render();
  requestAnimationFrame(loop);
}

lastTime = performance.now();
requestAnimationFrame(loop);
</script>
</body>
</html>
